# Publish a firmware release when a version tag is pushed.
#
# `scripts/release.py 0.92` bumps version.h, commits, tags and pushes; everything from
# there happens here. Building on a runner rather than on a laptop is what makes
# the published .syx traceable: the artifact people flash came from this commit,
# compiled by this log, not from whatever was in someone's working tree.
#
# The version guard is the reason this exists at all. A release tagged 0.92 whose
# firmware prints 0.91b on the panel is worse than no release, because the splash
# is the only version a user standing in front of the machine can read.

name: Release firmware

on:
  push:
    # Version tags only - pushing any other tag must not publish anything.
    # These are globs, not regexes: GitHub does not accept `+` here, and a
    # pattern written as a regex silently matches nothing at all.
    tags:
      - "[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Notes are generated from the log since the previous tag, which needs
          # more than the tagged commit itself.
          fetch-depth: 0

      - name: Check the tag against the firmware version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^#define FIRMWARE_VERSION "\(.*\)"/\1/p' \
            downtown-solutions_firmware/version.h)
          echo "version.h says: $version"
          echo "tag is:         $GITHUB_REF_NAME"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match FIRMWARE_VERSION $version."
            echo "The unit would show $version after being flashed from a release called $GITHUB_REF_NAME."
            echo "Use \`python3 scripts/release.py $GITHUB_REF_NAME\`, which bumps version.h and tags in one step."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # nava is a separate repository now, and the build needs it twice: the
      # post-action converts the .hex to a .syx, and the verification step below
      # decodes that .syx again. Installed into the same environment as
      # PlatformIO on purpose - pip-installed pio runs extra_scripts under this
      # interpreter, so anywhere else would be invisible to the post-action.
      - name: Install PlatformIO and the nava tools
        run: |
          set -euo pipefail
          # nava-tools depends on python-rtmidi, which has no wheel for every
          # interpreter and builds from source when it has none - and that build
          # wants a MIDI backend's headers. Nothing here sends MIDI; this is the
          # cost of installing the package whole rather than reasoning about
          # which of its dependencies the two steps below happen to reach.
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          pip install platformio "git+https://github.com/jeanbrazeau/nava-tools"

      - name: Build
        run: pio run -e nava_sysex

      - name: Name and verify the image
        id: image
        run: |
          set -euo pipefail
          asset="nava-${GITHUB_REF_NAME}.syx"
          cp .pio/build/nava_sysex/firmware.syx "$asset"
          # Decode it back before publishing: the post-build conversion is the
          # one step between a good compile and an image that bricks a unit, and
          # nothing downstream would notice a malformed one until someone flashed it.
          # python3 rather than python: setup-python provides both, and python3 is
          # the name that also works when running these steps by hand locally.
          python3 - "$asset" <<'PY'
          import sys
          from nava import bootloader
          with open(sys.argv[1], "rb") as handle:
              image = bootloader.decode_firmware(handle.read())
          print(f"{sys.argv[1]}: decodes to {len(image)} bytes of flash")
          PY
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          ASSET: ${{ steps.image.outputs.asset }}
        run: |
          set -euo pipefail
          # Quoted heredoc: the notes are full of backticks and ${...} that the
          # shell would otherwise eat. Placeholders are substituted afterwards.
          cat > notes.tmpl <<'EOF'
          Firmware for the Nava (ATmega1284p @ 16 MHz). The panel shows `__TAG__` on boot.

          ## Flashing

          ```bash
          uv tool install "git+https://github.com/jeanbrazeau/nava-tools[tui]"
          nava tui        # Firmware tab -> Download (latest) -> Inspect -> Flash
          ```

          Or from the command line, with the unit already in bootloader mode - stop the
          sequencer, hold SHIFT and press TEMPO to the `BOOTLOADER` page, press the encoder:

          ```bash
          nava flash __ASSET__ --out NAVA-909
          ```

          Back up your patterns first with `nava backup`. Flashing does not erase them,
          but a failed recovery might.
          EOF
          # Substituting into a second file rather than `sed -i`: in-place editing
          # needs an argument to -i on BSD sed and rejects one on GNU, so a line
          # that works on the runner cannot be run by hand on a Mac.
          sed "s|__TAG__|${GITHUB_REF_NAME}|g; s|__ASSET__|${ASSET}|g" \
            notes.tmpl > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.image.outputs.asset }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "downtown-solutions $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            "$ASSET"

      # The web tool's "Get an image" serves the current release from a copy
      # committed beside its page (nava-tools web/firmware/), because a browser
      # cannot fetch a release asset cross-origin. This step is what keeps that
      # copy current: it commits the image just published above into the tools
      # repository and dispatches its Pages deploy, so the live page and any
      # local checkout carry the new release without an upload.
      #
      # Needs a secret the default token cannot replace: GITHUB_TOKEN is scoped
      # to this repository. Create a fine-grained PAT for jeanbrazeau/nava-tools
      # with Contents and Actions set to read-and-write, and save it in this
      # repository's secrets as NAVA_TOOLS_TOKEN. Without it this step warns and
      # skips; the release itself is already published and unaffected.
      - name: Push the image to nava-tools
        env:
          GH_TOKEN: ${{ secrets.NAVA_TOOLS_TOKEN }}
          ASSET: ${{ steps.image.outputs.asset }}
          TOOLS_REPO: jeanbrazeau/nava-tools
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::NAVA_TOOLS_TOKEN is not set; $TOOLS_REPO keeps its previous image. Add a fine-grained PAT (Contents + Actions: read-and-write on $TOOLS_REPO) as a secret named NAVA_TOOLS_TOKEN."
            exit 0
          fi
          size=$(wc -c < "$ASSET" | tr -d ' ')
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TOOLS_REPO}.git" tools-checkout
          mkdir -p tools-checkout/web/firmware
          # One image beside the page, not an accumulating archive - older
          # releases stay reachable through the page's tag lookup.
          rm -f tools-checkout/web/firmware/*.syx
          cp "$ASSET" tools-checkout/web/firmware/
          # Same manifest shape the tools repository's Pages workflow writes on
          # its fallback path, and the page reads: releases.js bundled().
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg tag "$GITHUB_REF_NAME" \
                --arg name "downtown-solutions $GITHUB_REF_NAME" --arg file "$ASSET" \
                --arg published "$(date -u +%Y-%m-%d)" --argjson size "$size" \
                '{repo: $repo, tag: $tag, name: $name, published: $published, file: $file, size: $size}' \
            > tools-checkout/web/firmware/index.json
          cd tools-checkout
          git config user.name "github-actions[bot]"
          git config user.email "41898270+github-actions[bot]@users.noreply.github.com"
          git add web/firmware
          if git diff --cached --quiet; then
            echo "$TOOLS_REPO already carries $ASSET"
          else
            git commit -m "Ship firmware $GITHUB_REF_NAME beside the web tool"
            git push
          fi
          # Redeploy so the live site serves the new image now rather than on
          # the next hand-run deploy. Best effort: the commit above is the
          # durable part, and the next deploy from any trigger picks it up.
          gh workflow run pages.yml -R "$TOOLS_REPO" ||
            echo "::warning::could not dispatch the Pages deploy on $TOOLS_REPO; run it from the Actions tab"
